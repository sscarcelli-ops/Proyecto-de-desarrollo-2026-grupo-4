server:
  port: ${PORT:8080}

spring:
  application:
    name: accesos

  # Variables locales desde backend/.env (copiar .env.example). Si no existe, se usan las del sistema.
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Sin valores por defecto: las credenciales y direcciones salen siempre de las variables de entorno
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Fechas siempre en UTC entre la app y la BD (TIMESTAMPTZ), sin importar la zona de cada máquina
        jdbc:
          time_zone: UTC

  # RNF-10: PDF hasta 8 MB y foto hasta 2 MB. 10 MB por archivo deja margen;
  # 20 MB por petición cubre el alta de un trabajador con ART + Seguro de Vida + foto.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # Mensajes de validación (Bean Validation) siempre en español, sin depender del navegador
  web:
    locale: es
    locale-resolver: fixed

  flyway:
    enabled: true
    locations: classpath:db/migration

  # T-04: servidor de correo. Vacío (MAIL_HOST): no se envía y el contenido va al log (common/correo/CorreoService).
  # En Docker, los ambientes de prueba usan Mailpit (bandeja en http://localhost:8025, sin credenciales).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          # Si el servidor no responde, el pedido no queda colgado (milisegundos)
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # RNF-08: tamaño de página por defecto de los listados paginados (Pageable). Respuesta: PageResponse.
  data:
    web:
      pageable:
        default-page-size: ${PAGE_SIZE:20}
        max-page-size: 100

# Swagger y el contrato OpenAPI (de ahí sale schema.d.ts del frontend). En prod se apagan (application-prod.yml).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Logs (T-10): por consola siempre y, si se define LOG_FILE, también a un archivo que rota solo.
# Cada línea lleva el número de petición y el usuario del token: [a1b2c3d4 u:7]. Así se siguen todos los mensajes de
# un mismo pedido y se ve quién lo hizo. Cada pedido a la API deja una línea con método, ruta, estado y duración
# (common/logging/RegistroPeticionesFilter). Nunca se registran contraseñas, tokens ni el contenido de los pedidos.
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    # Mensajes propios de la app (aprobaciones, inicios de sesión, cada pedido a la API...)
    ar.edu.grupo4.accesos: ${LOG_LEVEL_APP:INFO}
  pattern:
    level: "%5p [%X{peticion:--} u:%X{usuario:--}]"
  file:
    # Vacío: solo consola. En Docker: /data/logs/accesos.log (volumen "logs")
    name: ${LOG_FILE:}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_FILE_MAX_SIZE:10MB}
      max-history: ${LOG_FILE_MAX_DAYS:14}

# Configuración personalizada de la app
app:
  # Zona horaria del sistema: qué es "hoy" para vencimientos y la hora que se muestra (AccesosApplication)
  zona-horaria: ${ZONA_HORARIA:America/Argentina/Buenos_Aires}
  security:
    jwt:
      # Firma HMAC: mínimo 32 caracteres. Sin valor por defecto: cada entorno define el suyo.
      secret: ${JWT_SECRET}
      # 8 horas (28800 s): una jornada de trabajo. Al vencer, el usuario vuelve a iniciar sesión.
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
  # US-01: código de activación del Administrador inicial (manual de instalación). Se carga al arrancar si no hay
  # Administrador. Para uno nuevo (se perdió o venció): cambiar el valor y reiniciar. Vacío: no se carga ninguno.
  activacion:
    token: ${ACTIVACION_TOKEN:}
    vigencia-dias: ${ACTIVACION_VIGENCIA_DIAS:30}
  # Dirección de la app que abre el usuario: arma los enlaces de los correos (US-06)
  url-frontend: ${APP_URL:http://localhost:5173}
  correo:
    # T-04: remitente de los correos del sistema
    remitente: ${MAIL_FROM:no-responder@accesos.local}
  # US-06: minutos que vale el enlace para recuperar la contraseña. Sirve una sola vez.
  recupero:
    vigencia-minutos: ${RECUPERO_VIGENCIA_MINUTOS:30}
  storage:
    base-path: ${STORAGE_PATH:/data/archivos}
  cors:
    # Lista separada por comas
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
