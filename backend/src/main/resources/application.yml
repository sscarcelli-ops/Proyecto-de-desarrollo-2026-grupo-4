server:
  port: ${PORT:8080}

spring:
  application:
    name: accesos

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:accesos_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Configuración personalizada de la app
app:
  storage:
    path: ${STORAGE_PATH:./uploads}
  paging:
    default-page-size: ${PAGE_SIZE:20}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}