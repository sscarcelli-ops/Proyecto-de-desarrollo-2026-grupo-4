# Sirve la app compilada (T-09). Cualquier dirección que no sea un archivo devuelve index.html: así funcionan
# las rutas de React (/barrios, /garita...) aunque se recargue la página o se escriban en la barra de direcciones.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Los archivos de assets/ llevan un hash en el nombre: se pueden guardar en caché sin vencimiento
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
