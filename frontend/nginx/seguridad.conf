# Headers de seguridad que nginx manda con cada respuesta. Le dicen al navegador qué puede hacer con la app.
# Se incluye en el server y en cada location que tenga su propio add_header (nginx no los hereda si la location define
# alguno). "always" los manda también en los errores (404, 500...).

# Solo se carga lo que viene de la propia app. Es la segunda barrera contra XSS: si algún dato llegara a meter un
# script, el navegador no lo ejecuta y no puede leer el token de localStorage.
# - style-src 'unsafe-inline': Ant Design arma sus estilos en el navegador (CSS-in-JS) con etiquetas <style>.
# - img-src / frame-src blob: y data:: la foto del trabajador y los PDF se muestran desde lo que descarga la app.
# - frame-ancestors 'none': ningún otro sitio puede meter la app en un iframe (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Lo mismo que frame-ancestors, para navegadores viejos
add_header X-Frame-Options "DENY" always;
# El navegador no "adivina" el tipo de un archivo: una "foto" que en realidad es un script no se ejecuta
add_header X-Content-Type-Options "nosniff" always;
# A otros sitios solo se les dice de qué dominio viene el usuario, nunca la ruta (/trabajadores/15...)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# La app no usa cámara, micrófono ni ubicación
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
