# Docker del proyecto. Un archivo de variables por ambiente (T-12); la imagen es la misma en todos.
#
#   Ambiente               Comando                                                         Datos
#   Prueba, con datos      docker compose --env-file docker/prueba.env up -d --build        Seed (casos de prueba)
#   Prueba, vacía          docker compose --env-file docker/prueba-vacia.env up -d --build  Sin datos (camino feliz, US-01)
#   Producción             docker compose --env-file docker/produccion.env up -d --build    Sin datos, credenciales propias
#   Desarrollo (IDE)       docker compose --env-file backend/.env up -d postgres            Solo la base
#
# Sin --env-file, "docker compose up -d --build" es Prueba con datos. No hace falta Java ni Node: Docker compila el
# backend y el frontend adentro (T-09). La app queda en http://localhost:5173 y la API en http://localhost:8080. En las
# pruebas, los correos que manda el sistema (recuperar contraseña) se ven en http://localhost:8025 (Mailpit, T-04).
#
#   Ver estado:            docker compose ps
#   Ver los logs:          docker compose logs -f backend
#   Apagar:                docker compose down
#   Borrar los datos:      docker compose down -v   (las bases vuelven a crearse vacías; el seed se carga solo)
#   Apagar solo la app:    docker compose rm -sf backend frontend   (la base sigue, para el IDE)
#
# Las dos pruebas usan bases distintas (accesos_db y accesos_vacia) en el mismo contenedor: se pasa de una a otra
# ejecutando el otro comando y cada una conserva sus datos.
#
# Si tenés PostgreSQL instalado usando el 5432 o tu backend/.env tiene otra contraseña: poné DB_PORT=5433 en
# backend/.env y agregá "--env-file backend/.env" antes del archivo del ambiente, así la base usa tu puerto y tu
# contraseña. Para todo en Docker, apagar antes el backend y el frontend del IDE (usan los mismos puertos).
#
# Es para instalaciones de prueba o locales: no exponerlo a internet (sin HTTPS y con puertos publicados).
name: accesos

services:
  postgres:
    image: postgres:17
    container_name: accesos-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-accesos_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Solo se ejecuta la primera vez (volumen vacío): crea la base accesos_vacia para probar US-01
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: accesos-backend
    # La plantilla (backend/.env.example funciona tal cual para probar) y encima el archivo del ambiente, que tiene
    # prioridad: cada archivo de docker/ define DOCKER_AMBIENTE con su propio nombre. El backend/.env del desarrollo
    # no se usa acá, para que cada ambiente quede igual en cualquier máquina.
    env_file:
      - path: backend/.env.example
      - path: ${DOCKER_AMBIENTE:-docker/prueba.env}
    # Tienen prioridad sobre los archivos de arriba:
    # - Adentro de Docker la base se llama "postgres" y escucha en su puerto interno.
    # - Usuario y contraseña: los mismos con los que se crea la base.
    # - Qué base y qué perfiles usa: DOCKER_BASE y DOCKER_PERFILES del ambiente (SPRING_PROFILES_ACTIVE no aplica acá).
    # - Los archivos subidos y los logs van a volúmenes, para no perderse al recrear el contenedor.
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DOCKER_BASE:-accesos_db}
      SPRING_PROFILES_ACTIVE: ${DOCKER_PERFILES:-dev,seed}
      PORT: "8080"
      STORAGE_PATH: /data/archivos
      LOG_FILE: /data/logs/accesos.log
      # Dirección de la app para los enlaces de los correos (US-06): la del frontend publicado
      APP_URL: ${APP_URL:-http://localhost:${FRONTEND_PORT:-5173}}
    ports:
      # Publicado para Swagger y Postman. La app no lo necesita: el frontend llega al backend por nginx.
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - archivos:/data/archivos
      - logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: accesos-frontend
    environment:
      # nginx reenvía /api a esta dirección (frontend/nginx/default.conf.template). Es la del backend dentro de la red
      # de Docker: el navegador no la usa, llama a /api en la misma dirección de la app. Así la imagen no lleva
      # ninguna dirección escrita y sirve para cualquier instalación.
      BACKEND_URL: ${DOCKER_BACKEND_URL:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # T-04: servidor de correo de prueba. No manda nada afuera: guarda los correos y los muestra en una bandeja web
  # (http://localhost:8025), sin credenciales. Solo en los ambientes de prueba (COMPOSE_PROFILES=correo en
  # docker/prueba.env y docker/prueba-vacia.env); en producción se usa el SMTP real (MAIL_HOST).
  # Desde el IDE: docker compose --env-file backend/.env up -d postgres mailpit, y MAIL_HOST=localhost en backend/.env.
  mailpit:
    image: axllent/mailpit:v1.27.0
    container_name: accesos-mailpit
    profiles: [correo]
    ports:
      - "${MAILPIT_PORT:-8025}:8025"   # bandeja web
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP, para el backend desde el IDE
    restart: unless-stopped

volumes:
  postgres-data:
  archivos:
  logs:
